version: '3.8'

services:
  # Managed PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: agency_os_db
    restart: always
    environment:
      POSTGRES_USER: agency_os
      POSTGRES_PASSWORD: agency_os_secure_password
      POSTGRES_DB: agency_os_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency_os -d agency_os_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Agency OS Backend API
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: agency_os_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://agency_os:agency_os_secure_password@db:5432/agency_os_prod?schema=public
      JWT_SECRET: replace_with_a_cryptographically_secure_random_string_min_32_characters!
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5174
      DEFAULT_CURRENCY: NPR
    ports:
      - "5000:5000"

volumes:
  postgres_data:
